<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Reel</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="reel-container">

    <!-- Reel Video -->
    <div class="reel">

        <video controls autoplay muted loop>
            <source src="reel.mp4" type="video/mp4">
        </video>

        <!-- User Information -->
        <div class="user-info">
            <img src="profile.jpg" alt="Profile">
            <strong>@my_reel_page</strong>
            <button>Follow</button>
        </div>

        <!-- Caption -->
        <div class="caption">
            <p>🔥 My First Instagram Reel</p>
            <p>#reels #instagram #viral</p>
        </div>

        <!-- Right Side Buttons -->
        <div class="actions">

            <div>
                ❤️
                <span>1.2K</span>
            </div>

            <div>
                💬
                <span>120</span>
            </div>

            <div>
                📤
                <span>Share</span>
            </div>

            <div>
                🔖
                <span>Save</span>
            </div>

        </div>

    </div>

</div>

</body>
</html>
